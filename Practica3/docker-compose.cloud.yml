name: yousac-cloud

# =====================================================================
# Entorno CLOUD (Google Cloud Platform — obligatorio segun enunciado).
# Pensado para ejecutarse en una VM de Compute Engine (o equivalente)
# con Docker + Docker Compose instalado. Usa variables de entorno de
# produccion (sin valores por defecto sensibles), volumenes remotos
# persistentes y politicas de reinicio "always" para alta disponibilidad.
#
# Solo se exponen puertos publicos para el API Gateway (north-south) y
# el cliente web; las bases de datos, Redis y los microservicios de
# dominio permanecen en la red interna (east-west, gRPC).
# =====================================================================

services:
  identity-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME}
      POSTGRES_USER: ${IDENTITY_DB_USER}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD}
    volumes:
      - identity_db_data:/var/lib/postgresql/data
      - ./services/identity-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDENTITY_DB_USER} -d ${IDENTITY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [yousac-net]

  content-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${CONTENT_DB_NAME}
      POSTGRES_USER: ${CONTENT_DB_USER}
      POSTGRES_PASSWORD: ${CONTENT_DB_PASSWORD}
    volumes:
      - content_db_data:/var/lib/postgresql/data
      - ./services/content-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONTENT_DB_USER} -d ${CONTENT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [yousac-net]

  analytics-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${ANALYTICS_DB_NAME}
      POSTGRES_USER: ${ANALYTICS_DB_USER}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    volumes:
      - analytics_db_data:/var/lib/postgresql/data
      - ./services/analytics-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_DB_USER} -d ${ANALYTICS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [yousac-net]

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [yousac-net]

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    restart: always
    env_file: [services/identity-service/.env]
    environment:
      NODE_ENV: production
      DB_HOST: identity-db
      DB_PORT: 5432
      DB_NAME: ${IDENTITY_DB_NAME}
      DB_USER: ${IDENTITY_DB_USER}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
    depends_on:
      identity-db:
        condition: service_healthy
    networks: [yousac-net]

  content-service:
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
    restart: always
    env_file: [services/content-service/.env]
    environment:
      DB_HOST: content-db
      DB_PORT: 5432
      DB_NAME: ${CONTENT_DB_NAME}
      DB_USER: ${CONTENT_DB_USER}
      DB_PASSWORD: ${CONTENT_DB_PASSWORD}
    depends_on:
      content-db:
        condition: service_healthy
    networks: [yousac-net]

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    restart: always
    env_file: [services/analytics-service/.env]
    environment:
      DB_HOST: analytics-db
      DB_PORT: 5432
      DB_NAME: ${ANALYTICS_DB_NAME}
      DB_USER: ${ANALYTICS_DB_USER}
      DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      analytics-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [yousac-net]

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    restart: always
    env_file: [api-gateway/.env]
    environment:
      NODE_ENV: production
      IDENTITY_SERVICE_GRPC_URL: identity-service:50051
      CONTENT_SERVICE_GRPC_URL: content-service:50052
      ANALYTICS_SERVICE_GRPC_URL: analytics-service:50053
      WEB_CLIENT_ORIGIN: ${WEB_CLIENT_PUBLIC_URL}
    ports:
      - "8080:8080"
    depends_on: [identity-service, content-service, analytics-service]
    networks: [yousac-net]

  web-client:
    build:
      context: .
      dockerfile: web-client/Dockerfile
      target: runtime
      args:
        VITE_API_GATEWAY_URL: ${API_GATEWAY_PUBLIC_URL}
    restart: always
    ports:
      - "80:80"
    depends_on: [api-gateway]
    networks: [yousac-net]

networks:
  yousac-net:
    driver: bridge

# Volumenes remotos persistentes (respaldados por disco del proveedor
# Cloud, p.ej. un Persistent Disk de GCP montado en el host de Compute
# Engine y referenciado aqui como bind mount, o un volumen nombrado
# gestionado por el driver de Docker en la VM).
volumes:
  identity_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REMOTE_VOLUME_PATH}/identity-db
  content_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REMOTE_VOLUME_PATH}/content-db
  analytics_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REMOTE_VOLUME_PATH}/analytics-db
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REMOTE_VOLUME_PATH}/redis
