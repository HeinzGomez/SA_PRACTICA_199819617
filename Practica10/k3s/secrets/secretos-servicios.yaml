# HeinzGomez - Práctica 10: secretos propios de cada servicio (no van en datos-conexiones).
# Valores alineados con ansible/group_vars/all/99-secretos.yml (fuente que usa Ansible
# para arrancar los servicios en las VMs del compose).
apiVersion: v1
kind: Secret
metadata:
  name: secretos-servicios
  namespace: academix
  labels:
    app.kubernetes.io/part-of: academix
type: Opaque
stringData:
  # auth-service
  JWT_SECRET: "mi_contrasena_ultra_secreta"
  ADMIN_PASSWORD: "Admin12345"

  # certificados-service (semilla de la firma de certificados)
  CERT_SIGNING_SEED: "cambiar-esta-semilla-en-produccion"

  # grafana (UI de monitoreo; los mismos valores por defecto que en compose)
  GRAFANA_ADMIN_USER: "practicasa"
  GRAFANA_ADMIN_PASSWORD: "Admin123"

  # rabbitmq (credenciales del broker desplegado en el cluster; debe coincidir
  # con RABBITMQ_URL de datos-conexiones)
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"
