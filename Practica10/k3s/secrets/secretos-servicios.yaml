# HeinzGomez - Práctica 10: secretos propios de cada servicio (no van en datos-conexiones).
# PLACEHOLDERS: sustituir con SOPS/SealedSecrets o el IaC; nunca commitear valores reales.
apiVersion: v1
kind: Secret
metadata:
  name: secretos-servicios
  namespace: academix
  labels:
    app.kubernetes.io/part-of: academix
type: Opaque
stringData:
  # auth-service
  JWT_SECRET: "CAMBIAR-ESTE-JWT-SECRET"
  ADMIN_PASSWORD: "Admin12345"

  # certificados-service (semilla de la firma de certificados)
  CERT_SIGNING_SEED: "CAMBIAR-ESTA-SEMILLA-DE-FIRMA"

  # grafana (UI de monitoreo; los mismos valores por defecto que en compose)
  GRAFANA_ADMIN_USER: "practicasa"
  GRAFANA_ADMIN_PASSWORD: "Admin123"

  # rabbitmq (credenciales del broker desplegado en el cluster)
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "CAMBIAR-ESTE-RABBIT-PASS"
