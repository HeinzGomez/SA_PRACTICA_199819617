# HeinzGomez - Práctica 10: secretos de conexión a datos (base de datos EXTERNA en otra VM).
#
# El DNS de la VM de BD (academxdb.yo-usac.com) lo crea Terraform (dns.tf, record A →
# IP estática de vm-database). Los valores coinciden con ansible/group_vars/all/99-secretos.yml,
# que es de donde Ansible arranca el PostgreSQL de la VM de BD.
apiVersion: v1
kind: Secret
metadata:
  name: datos-conexiones
  namespace: academix
  labels:
    app.kubernetes.io/part-of: academix
type: Opaque
stringData:
  # VM externa de BD (PostgreSQL 16) vía DNS estático.
  DB_HOST: "academxdb.yo-usac.com"
  DB_PUERTO: "5432"
  DB_USUARIO: "academix"
  DB_PASSWORD: "secret"

  # URLs completas por base de datos (mismas BDs que el docker-compose).
  DATABASE_URL_AUTH: "postgres://academix:secret@academxdb.yo-usac.com:5432/auth_db"
  DATABASE_URL_TALLERES: "postgres://academix:secret@academxdb.yo-usac.com:5432/talleres_db"
  DATABASE_URL_RESERVAS: "postgres://academix:secret@academxdb.yo-usac.com:5432/reservas_db?sslmode=disable"
  DATABASE_URL_CERTIFICADOS: "postgresql://academix:secret@academxdb.yo-usac.com:5432/certificados_db"

  # Broker (RabbitMQ desplegado en el propio cluster, servicio interno).
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.academix.svc.cluster.local:5672/"

  # Redis (desplegado en el propio cluster).
  REDIS_URL: "redis://redis.academix.svc.cluster.local:6379"
  REDIS_ADDR: "redis.academix.svc.cluster.local:6379"
