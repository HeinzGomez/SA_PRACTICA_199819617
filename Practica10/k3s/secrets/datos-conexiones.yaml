# HeinzGomez - Práctica 10: secretos de conexión a datos (base de datos EXTERNA en otra VM).
#
# IMPORTANTE:
#   - Los valores de abajo son PLACEHOLDERS de desarrollo. En producción se sustituyen con
#     SOPS/SealedSecrets o con el despliegue IaC (Terraform/Ansible), nunca se commitean
#     valores reales.
#   - DB_HOST apunta a la VM externa de bases de datos. El DNS real se definirá en el IaC;
#     de momento se deja indicado con este nombre ficticio.
apiVersion: v1
kind: Secret
metadata:
  name: datos-conexiones
  namespace: academix
  labels:
    app.kubernetes.io/part-of: academix
type: Opaque
stringData:
  # VM externa de BD (PostgreSQL 16). TODO(IaC): sustituir por el DNS real vía Terraform/Ansible.
  DB_HOST: "db.externa.academix.gt"   # <- DNS pendiente de configurar en el IaC
  DB_PUERTO: "5432"
  DB_USUARIO: "academix"
  DB_PASSWORD: "CAMBIAR-ESTE-POSTGRES-PASSWORD"

  # URLs completas por base de datos (mismas BDs que el docker-compose).
  DATABASE_URL_AUTH: "postgres://academix:CAMBIAR-ESTE-POSTGRES-PASSWORD@db.externa.academix.gt:5432/auth_db"
  DATABASE_URL_TALLERES: "postgres://academix:CAMBIAR-ESTE-POSTGRES-PASSWORD@db.externa.academix.gt:5432/talleres_db"
  DATABASE_URL_RESERVAS: "postgres://academix:CAMBIAR-ESTE-POSTGRES-PASSWORD@db.externa.academix.gt:5432/reservas_db?sslmode=disable"
  DATABASE_URL_CERTIFICADOS: "postgresql://academix:CAMBIAR-ESTE-POSTGRES-PASSWORD@db.externa.academix.gt:5432/certificados_db"

  # Broker (RabbitMQ desplegado en el propio cluster, servicio interno).
  RABBITMQ_URL: "amqp://guest:CAMBIAR-ESTE-RABBIT-PASS@rabbitmq.academix.svc.cluster.local:5672/"

  # Redis (desplegado en el propio cluster).
  REDIS_URL: "redis://redis.academix.svc.cluster.local:6379"
  REDIS_ADDR: "redis.academix.svc.cluster.local:6379"
