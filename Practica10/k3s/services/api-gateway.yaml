# HeinzGomez - Práctica 10: servicio interno del api-gateway.

apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: academix
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: academix
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
