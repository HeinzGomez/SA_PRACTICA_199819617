# HeinzGomez - Práctica 10: servicio interno del auth-service (solo lo usa el api-gateway).
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: academix
  labels:
    app: auth-service
    app.kubernetes.io/part-of: academix
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8091
      targetPort: http
      protocol: TCP
