# HeinzGomez - Práctica 10: talleres-service (eventos + cupos en Redis + cola talleres.solicitudes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: talleres-service
  namespace: academix
  labels:
    app: talleres-service
    app.kubernetes.io/part-of: academix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: talleres-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: talleres-service
        app.kubernetes.io/part-of: academix
    spec:
      containers:
        - name: talleres-service
          image: ghcr.io/heinzgomez/academix-talleres-service:${IMAGE_TAG}
          ports:
            - containerPort: 8092
              name: http
          envFrom:
            - configMapRef:
                name: talleres-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: datos-conexiones
                  key: DATABASE_URL_TALLERES
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: datos-conexiones
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: datos-conexiones
                  key: RABBITMQ_URL
            - name: NODE_OPTIONS
              value: "--max-old-space-size=320"
          resources:
            requests:
              cpu: "100m"
              memory: "160Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Liveness: /health · Readiness: /health/ready (Postgres + Redis + broker).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5          # el default (1s) es demasiado ajustado
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
