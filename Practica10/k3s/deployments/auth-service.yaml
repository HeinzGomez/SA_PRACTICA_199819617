# HeinzGomez - Práctica 10: auth-service (CDU 1.1-1.3; siembra admin con bcrypt al arrancar).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: academix
  labels:
    app: auth-service
    app.kubernetes.io/part-of: academix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auth-service
        app.kubernetes.io/part-of: academix
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/heinzgomez/academix-auth-service:${IMAGE_TAG}
          ports:
            - containerPort: 8091
              name: http
          envFrom:
            - configMapRef:
                name: auth-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: datos-conexiones
                  key: DATABASE_URL_AUTH
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: datos-conexiones
                  key: RABBITMQ_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secretos-servicios
                  key: JWT_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secretos-servicios
                  key: ADMIN_PASSWORD
            - name: NODE_OPTIONS
              value: "--max-old-space-size=320"
          resources:
            requests:
              cpu: "100m"
              memory: "160Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Liveness: /health · Readiness: /health/ready (Postgres + broker).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5          # el default (1s) es demasiado ajustado
            failureThreshold: 36        # bcrypt del seed admin puede tardar
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
