# HeinzGomez - Práctica 10: Redis en el cluster (cupos atómicos + SSE de disponibilidad).
# appendonly para no perder contadores de cupo al reiniciar.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-datos
  namespace: academix
  labels:
    app: redis
    app.kubernetes.io/part-of: academix
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: academix
  labels:
    app: redis
    app.kubernetes.io/part-of: academix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    type: Recreate          # PVC RWO
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: academix
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: datos
              mountPath: /data
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "250m"
              memory: "192Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999           # usuario redis de la imagen alpine
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 5          # el default (1s) deja poco margen al arrancar
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: redis-datos
