# HeinzGomez - Práctica 10: api-gateway (única puerta de entrada; el frontend en Vercel lo consume).
# Imagen publicada por CI a ghcr.io. Sustituir ${IMAGE_TAG} en el despliegue (envsubst/kustomize).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: academix
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: academix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: academix
    spec:
      # Si el registro ghcr.io es privado: imagePullSecrets con credenciales de ghcr.
      # imagePullSecrets:
      #   - name: ghcr-credenciales
      containers:
        - name: api-gateway
          image: ghcr.io/heinzgomez/academix-api-gateway:${IMAGE_TAG}
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: api-gateway-config
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: datos-conexiones
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000          # uid numérico del usuario "node" de la imagen (runAsNonRoot lo exige numérico)
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # /health: liveness (proceso vivo). /health/ready: readiness (broker alcanzable).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5          # el default (1s) es demasiado ajustado
            failureThreshold: 36        # hasta 3 min para el arranque completo
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
