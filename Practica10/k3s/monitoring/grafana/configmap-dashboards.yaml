# HeinzGomez - Práctica 10: tableros de Grafana aprovisionados por archivo.
# Migrados tal cual desde monitoring/grafana/dashboards/ (los mismos del compose).
# Regenerar este ConfigMap si cambia un JSON:
#   kubectl create configmap grafana-dashboards -n academix \
#     --from-file=infraestructura.json=monitoring/grafana/dashboards/infraestructura.json \
#     --from-file=negocio-colas.json=monitoring/grafana/dashboards/negocio-colas.json \
#     --dry-run=client -o yaml > k3s/monitoring/grafana/configmap-dashboards.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: academix
  labels:
    app.kubernetes.io/part-of: academix
    app: grafana
