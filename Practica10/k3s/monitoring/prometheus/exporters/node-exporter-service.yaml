# HeinzGomez - Práctica 10: servicio interno de node-exporter (scrape target de Prometheus).
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: academix
  labels:
    app: node-exporter
    app.kubernetes.io/part-of: academix
spec:
  type: ClusterIP
  selector:
    app: node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
