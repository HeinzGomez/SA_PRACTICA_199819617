---
# Punto de entrada único:  ansible-playbook -i inventory.ini site.yml
# Cada paso es un playbook independiente para poder ejecutarlo por separado.

# 01 · Todas las VMs: repositorios, utilitarios y securización de SSH
- import_playbook: playbooks/base.yml

# 02 · vm-development y vm-database: Docker + Docker Compose + grupo docker
- import_playbook: playbooks/docker.yml

# 03 · vm-production-k3s: servidor/control-plane de K3s
- import_playbook: playbooks/k3s.yml

# 04 · vm-production-k3s: ingress (controlador + cert-manager)
- import_playbook: playbooks/ingress.yml

# 05 · vm-development y vm-database: carpeta academix/ con su .env
- import_playbook: playbooks/entorno.yml

# 06 · vm-database: PostgreSQL de producción (compose + infra + arranque)
- import_playbook: playbooks/db.yml

# 07 · vm-production-k3s: manifests de la aplicación (kubectl apply de Practica10/k3s/
#      con IMAGE_TAG=latest + esperas de rollout). Va AL FINAL: necesita el controlador
#      de ingress (04) y la BD externa (06) ya desplegados.
- import_playbook: playbooks/despliegue-k3s.yml
