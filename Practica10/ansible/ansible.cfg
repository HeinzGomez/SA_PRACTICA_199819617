[defaults]
inventory              = inventory.ini
interpreter_python     = auto_silent
private_key_file       = ~/.ssh/academix_lab
host_key_checking      = False
retry_files_enabled    = False
deprecation_warnings   = False
forks                  = 20
timeout                = 60
gathering              = smart
stdout_callback        = default

[ssh_connection]
pipelining = True
# ServerAliveInterval mantiene viva la conexión durante esperas largas sin
# tráfico (kubectl rollout status --timeout=300s): sin él, el runner perdía
# la sesión SSH a mitad de tarea ("Data could not be sent to remote host").
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=8
