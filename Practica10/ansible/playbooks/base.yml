---
- name: Base · actualización de repositorios, utilitarios y securización de SSH
  hosts: all
  become: true

  tasks:
    - name: Actualizar índices de repositorios
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Actualizar paquetes instalados
      ansible.builtin.apt:
        upgrade: "{{ paquetes_upgrade }}"
        autoremove: true
        autoclean: true
      when: paquetes_upgrade | lower != 'none'

    - name: Instalar utilitarios base
      ansible.builtin.apt:
        name: "{{ paquetes_utilitarios }}"
        state: present

    - name: Asegurar la carpeta de configuración de SSH
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Aplicar reglas de endurecimiento de SSH
      ansible.builtin.template:
        src: ../templates/sshd-academix.j2
        dest: /etc/ssh/sshd_config.d/00-academix.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reiniciar el servicio de SSH

    - name: Servicio de SSH activo y habilitado al arrancar
      ansible.builtin.service:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: started
        enabled: true

  handlers:
    - name: Reiniciar el servicio de SSH
      ansible.builtin.service:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: restarted
