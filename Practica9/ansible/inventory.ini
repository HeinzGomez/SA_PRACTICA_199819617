# Inventario de Ansible — mapea las IPs públicas generadas por Terraform.
#
# Regenerarlo después de cada `terraform apply`:
#   cd terraform && terraform output -raw inventory_ini > ../ansible/inventory.ini
#
# Formato de cada host:  <alias igual al nombre de la VM en GCP> ansible_host=<IP pública>

[desarrollo]
vm-development ansible_host=CAMBIA_IP_VM_DEVELOPMENT

[base_de_datos]
vm-database ansible_host=CAMBIA_IP_VM_DATABASE

[k3s]
vm-production-k3s ansible_host=CAMBIA_IP_VM_PRODUCTION_K3S

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
