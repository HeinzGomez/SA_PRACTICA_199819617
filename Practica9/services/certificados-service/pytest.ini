# HeinzGomez - Práctica 9: suite de pruebas del Servicio de Certificados.
#
# Configurada para correr liviana, en un solo proceso y con poca RAM:
#   * sin pytest-xdist: cada worker duplicaría el intérprete y la librería
#     `cryptography`, que es lo que más memoria consume de la suite;
#   * sin caché de pytest: no se escribe ni se relee .pytest_cache;
#   * --tb=short: el reporte de fallos no crece sin control.
# La cobertura (mínimo 70 %, con ramas) vive en .coveragerc.
[pytest]
testpaths = tests
addopts = -q --tb=short -p no:cacheprovider -p no:xdist
