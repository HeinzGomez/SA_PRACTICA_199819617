# HeinzGomez - Práctica 7: Pipeline de Integración Continua (CI) de Academix Pass & CertiHub
#
#  1. Pruebas unitarias por lenguaje (Go / TypeScript / Python / Frontend) en paralelo.
#  2. build-and-push: SOLO si todas las pruebas pasan (needs => cortocircuito) construye las
#     6 imágenes Docker y las publica en GitHub Container Registry (ghcr.io).
#     - Pull Request  -> se construyen para validar los Dockerfile, NO se publican.
#     - push a develop/main o tag v*.*.* -> se publican con tags de rama, sha, semver y latest.
#
#  Ubicación: raíz del repositorio SA_PRACTICA_199819617. El código vive en Practica8/, por eso
#  todas las rutas llevan ese prefijo y el workflow solo se dispara con cambios en esa carpeta.
name: CI - Practica 8 Academix Pass

on:
  push:
    branches: [main, develop, release]
    tags: ['v*.*.*', 'V*.*.*']
    paths:
      - 'Practica8/**'
      - '.github/workflows/ci-practica8.yml'
  pull_request:
    branches: [main, develop, release]
    paths:
      - 'Practica8/**'
      - '.github/workflows/ci-practica8.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------ Go
  test-go:
    name: Pruebas Go · reservas-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Practica8/services/reservas-service
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Resolver dependencias
        run: |
          if [ ! -f go.sum ]; then go mod tidy; fi
          go mod download
      - name: go vet
        run: go vet ./...
      - name: go test (con race detector y cobertura)
        env:
          REDIS_ADDR: localhost:6379
        run: |
          set -o pipefail
          go test -race -covermode=atomic -coverprofile=coverage.out -v ./... 2>&1 | tee go-test.log
      - name: Resumen de cobertura
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-go
          path: |
            Practica8/services/reservas-service/coverage.out
            Practica8/services/reservas-service/go-test.log

  # ------------------------------------------------------------------ TypeScript (servicios)
  test-node:
    name: Pruebas Jest · ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [auth-service, talleres-service, api-gateway]
    defaults:
      run:
        working-directory: Practica8/services/${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Practica8/services/${{ matrix.servicio }}/package-lock.json
      - run: npm ci
      - name: Compilar TypeScript
        run: npm run build
      - name: Jest con cobertura
        run: npm test -- --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-${{ matrix.servicio }}
          path: Practica8/services/${{ matrix.servicio }}/coverage/

  # ------------------------------------------------------------------ Python
  test-python:
    name: Pruebas pytest · certificados-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Practica8/services/certificados-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Practica8/services/certificados-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validar que TODOS los contratos .proto compilan
        run: |
          mkdir -p /tmp/protocheck
          python -m grpc_tools.protoc -I../../proto --python_out=/tmp/protocheck ../../proto/*.proto
      - name: Generar stubs gRPC
        run: sh gen_proto.sh
      - name: pytest con cobertura
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-python
          path: |
            Practica8/services/certificados-service/coverage.xml
            Practica8/services/certificados-service/pytest-report.xml

  # ------------------------------------------------------------------ Frontend (Next.js)
  test-frontend:
    name: Pruebas y build · frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Practica8/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Practica8/frontend/package-lock.json
      - run: npm ci
      - name: Verificación de tipos
        run: npm run lint
      - name: Jest con cobertura
        run: npm test -- --ci
      - name: Build de producción (mismo que ejecuta Vercel)
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-frontend
          path: Practica8/frontend/coverage/

  # ------------------------------------------------------------------ Imágenes -> GHCR
  build-and-push:
    name: Imagen · ${{ matrix.imagen.nombre }}
    runs-on: ubuntu-latest
    needs: [test-go, test-node, test-python, test-frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        imagen:
          - { nombre: academix-auth-service, dockerfile: Practica8/services/auth-service/Dockerfile }
          - { nombre: academix-talleres-service, dockerfile: Practica8/services/talleres-service/Dockerfile }
          - { nombre: academix-reservas-service, dockerfile: Practica8/services/reservas-service/Dockerfile }
          - { nombre: academix-certificados-service, dockerfile: Practica8/services/certificados-service/Dockerfile }
          - { nombre: academix-api-gateway, dockerfile: Practica8/services/api-gateway/Dockerfile }
          - { nombre: academix-frontend, dockerfile: Practica8/frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Nombre del owner en minúsculas (requisito de GHCR)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Login a GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.imagen.nombre }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.imagen.nombre }}
            org.opencontainers.image.description=YOUSAC Academix Pass & CertiHub - ${{ matrix.imagen.nombre }}
      - name: Build (y push fuera de PR)
        uses: docker/build-push-action@v6
        with:
          context: Practica8
          file: ${{ matrix.imagen.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.imagen.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen.nombre }}
      - name: Resumen
        run: |
          echo "### ${{ matrix.imagen.nombre }}" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ Despliegue Continuo (CD) a VM
  deploy-vm:
    name: Deploy CD a la VM (docker compose pull)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Pre-limpieza de init.sql (Evita error Is a directory)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            rm -rf "${{ secrets.VM_PROJECT_PATH }}/infra/postgres/init.sql"

      - name: Copiar docker-compose.cloud.yml e init.sql a la VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: Practica8/docker-compose.cloud.yml,Practica8/infra/postgres/init.sql
          target: ${{ secrets.VM_PROJECT_PATH }}
          strip_components: 1
          overwrite: true
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VM_PROJECT_PATH }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            export IMAGE_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
            export IMAGE_TAG="sha-$IMAGE_TAG"
            
            echo "Desplegando imagen con tag: $IMAGE_TAG"
            
            docker compose -f docker-compose.cloud.yml pull
            docker compose -f docker-compose.cloud.yml up -d --remove-orphans
            
            docker image prune -f
