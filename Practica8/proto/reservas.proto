// HeinzGomez - Práctica 7: contrato gRPC del Servicio de Reservas / Ticketing (CDU 3.1 - 3.3)
// La reserva NO es bloqueante: SolicitarReserva publica en RabbitMQ y devuelve un ticket PENDIENTE.
syntax = "proto3";

package academix.reservas.v1;

option go_package = "github.com/academix/reservas-service/gen/reservasv1;reservasv1";

service ReservasService {
  // Productor: encola la solicitud en "reservas.solicitudes" y responde de inmediato (202)
  rpc SolicitarReserva(SolicitudReserva) returns (Ticket);
  // Polling del estado del ticket (PENDIENTE -> CONFIRMADA | RECHAZADA)
  rpc ConsultarTicket(TicketId) returns (Ticket);
  rpc ListarReservasUsuario(UsuarioId) returns (ListaTickets);
}

enum EstadoTicket {
  ESTADO_TICKET_UNSPECIFIED = 0;
  PENDIENTE = 1;
  CONFIRMADA = 2;
  RECHAZADA = 3;
}

message SolicitudReserva {
  string usuario_id = 1;
  string evento_id = 2;
  string tipo = 3; // ACREDITACION | EXAMEN_CERTIFICACION
}

message Ticket {
  string id = 1;
  string usuario_id = 2;
  string evento_id = 3;
  EstadoTicket estado = 4;
  string motivo = 5;
  string tipo = 6;
  string creado_en = 7;
  string actualizado_en = 8;
  int32 cupo_restante = 9;
}

message TicketId {
  string id = 1;
}

message UsuarioId {
  string id = 1;
}

message ListaTickets {
  repeated Ticket tickets = 1;
}
