# HeinzGomez - Práctica 7: entorno de desarrollo completo (Docker Compose)
#   docker compose up --build        -> frontend http://localhost:3000 · gateway http://localhost:8080
#   RabbitMQ management               -> http://localhost:15672 (guest/guest)
name: academix

x-common: &grpc-common
  restart: unless-stopped
  networks: [academix]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: academix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academix}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academix -d postgres"]
      interval: 5s
      retries: 10
    networks: [academix]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [academix]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 12
    networks: [academix]

  auth-service:
    <<: *grpc-common
    build: { context: ., dockerfile: services/auth-service/Dockerfile }
    image: academix-auth-service:dev
    environment:
      DATABASE_URL: postgres://academix:${POSTGRES_PASSWORD:-academix}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secreto-en-produccion}
      ADMIN_EMAIL: admin@ingenieria.usac.edu.gt
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
    depends_on:
      postgres: { condition: service_healthy }

  talleres-service:
    <<: *grpc-common
    build: { context: ., dockerfile: services/talleres-service/Dockerfile }
    image: academix-talleres-service:dev
    environment:
      DATABASE_URL: postgres://academix:${POSTGRES_PASSWORD:-academix}@postgres:5432/talleres_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  reservas-service:
    <<: *grpc-common
    build: { context: ., dockerfile: services/reservas-service/Dockerfile }
    image: academix-reservas-service:dev
    environment:
      DATABASE_URL: postgres://academix:${POSTGRES_PASSWORD:-academix}@postgres:5432/reservas_db?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      WORKERS: "4"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      talleres-service: { condition: service_started }

  certificados-service:
    <<: *grpc-common
    build: { context: ., dockerfile: services/certificados-service/Dockerfile }
    image: academix-certificados-service:dev
    environment:
      DATABASE_URL: postgresql://academix:${POSTGRES_PASSWORD:-academix}@postgres:5432/certificados_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      CERT_SIGNING_SEED: ${CERT_SIGNING_SEED:-cambiar-esta-semilla-en-produccion}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  api-gateway:
    <<: *grpc-common
    build: { context: ., dockerfile: services/api-gateway/Dockerfile }
    image: academix-api-gateway:dev
    environment:
      AUTH_GRPC: auth-service:50051
      TALLERES_GRPC: talleres-service:50052
      RESERVAS_GRPC: reservas-service:50053
      CERTIFICADOS_GRPC: certificados-service:50054
      CORS_ORIGINS: http://localhost:3000,*.vercel.app
    ports: ["8080:8080"]
    depends_on: [auth-service, talleres-service, reservas-service, certificados-service]

  frontend:
    <<: *grpc-common
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    image: academix-frontend:dev
    ports: ["3000:3000"]
    depends_on: [api-gateway]

networks:
  academix:

volumes:
  pgdata:
